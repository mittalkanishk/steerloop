name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the module's Go version: staticcheck, via golangci-lint,
      # cannot yet read export data from the newest Go.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      # typecheck downloads missing modules and does not retry. A dropped
      # proxy.golang.org zip (HTTP/2 INTERNAL_ERROR) is reported as an import error.
      - name: Download modules
        run: |
          for attempt in 1 2 3 4 5; do
            go mod download && exit 0
            echo "go mod download failed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          exit 1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage gate (library, 85%)
        run: |
          go test -count=1 -coverprofile=lib.out .
          total=$(go tool cover -func=lib.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "library coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 85.0) ? 0 : 1 }'

      - name: Fuzz (30s)
        run: |
          go test -run '^$' -fuzz FuzzNewToolInfo -fuzztime 15s .
          go test -run '^$' -fuzz FuzzSerializeEinoMessagesForAudit -fuzztime 15s .

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
