[tools]
go = "1.26"
golangci-lint = "2.9.0"

[env]
# Build this module on its own even when a parent directory has a go.work.
GOWORK = "off"

[tasks.test]
description = "Run the tests with the race detector"
file = ".mise/scripts/test.sh"

[tasks.lint]
description = "Run golangci-lint"
file = ".mise/scripts/lint.sh"

[tasks.git-tag-release]
description = "Tag a release from main and push the tag (triggers the Release workflow). Set VERSION=vX.Y.Z to skip the prompt."
file = ".mise/scripts/git-tag-release.sh"

[tasks.steerloop]
description = "Run the local steerloop pkg binary"
run = "go run ./cmd/steerloop"

[tasks.steerloop2]
description = "Run the local steerloop2 binary"
run = "go run ./cmd/steerloop2"

[tasks.steerloop-record-run]
description = "Record a local run to run.jsonl. Flags after -- are passed through."
run = "go run ./cmd/steerloop run --record run.jsonl"
