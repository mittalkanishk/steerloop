# An example tool manifest for "steerloop run --tools".
# Every command is run as an argv list, never through a shell.
tools:
  - name: grep_repo
    description: Search files under the current directory for a regular expression.
    parameters:
      type: object
      properties:
        pattern: { type: string, description: The regular expression. }
      required: [pattern]
    command: ["grep", "-rn", "--", "{{.pattern}}", "."]
    timeout: 20s
    max_output_bytes: 8000

  - name: count_lines
    description: Count the lines of a file in the current directory.
    parameters:
      type: object
      properties:
        path: { type: string, description: File to count. }
      required: [path]
    command: ["wc", "-l", "--", "{{.path}}"]

  - name: make_dir
    description: Create a directory. Asks before it runs.
    parameters:
      type: object
      properties:
        path: { type: string }
      required: [path]
    command: ["mkdir", "-p", "--", "{{.path}}"]
    confirm: true
