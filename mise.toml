[tools]
go = "1.26"
golangci-lint = "2.9.0"
mockery = "3.8.1"

[env]
# Build this module on its own even when a parent directory has a go.work.
GOWORK = "off"

[tasks.test]
description = "Run the tests with the race detector"
file = ".mise/scripts/test.sh"

[tasks.lint]
description = "Run golangci-lint"
file = ".mise/scripts/lint.sh"

[tasks.generate-mocks]
description = "Regenerate the mocks in each _mocks folder from .mockery.yml"
file = ".mise/scripts/mocks.sh"

[tasks.git-tag-release]
description = "Tag a release from main and push the tag (triggers the Release workflow). Set VERSION=vX.Y.Z to skip the prompt."
file = ".mise/scripts/git-tag-release.sh"

[tasks.steerloop]
description = "Run the local steerloop binary"
run = "go run ./cmd/steerloop"
