# Tools used by the tests and the examples. Every command is run as an argv
# list, never through a shell.
tools:
  - name: say
    description: Print a message and return it.
    parameters:
      type: object
      properties:
        message: { type: string, description: The text to print. }
      required: [message]
    command: ["echo", "{{.message}}"]

  - name: count_lines
    description: Count the lines of a file in the current directory.
    parameters:
      type: object
      properties:
        path: { type: string, description: File to count. }
      required: [path]
    command: ["wc", "-l", "--", "{{.path}}"]
    timeout: 10s

  - name: danger
    description: A tool that must be approved before it runs.
    parameters:
      type: object
      properties:
        target: { type: string }
      required: [target]
    command: ["echo", "removed {{.target}}"]
    confirm: true

  - name: nap
    description: Wait for a number of seconds.
    parameters:
      type: object
      properties:
        seconds: { type: string }
      required: [seconds]
    command: ["sleep", "{{.seconds}}"]
